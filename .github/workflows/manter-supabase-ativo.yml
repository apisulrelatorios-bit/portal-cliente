# Mantém o projeto Supabase (plano gratuito) ativo.
# O Supabase pausa projetos gratuitos depois de 7 dias sem uso; esta ação
# faz uma consulta mínima (função public.ping, que só devolve a hora do
# banco) a cada 3 dias. Também pode ser rodada à mão em Actions > Run workflow.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */3 * *"   # a cada 3 dias, 12:00 UTC (09:00 de Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hqxkqzhioilnrvmaylgy.supabase.co' }}
      # Chave pública (publishable) — a mesma que já está no site; não é segredo.
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_DGDGvLlTO2YVVmEjsAzvpQ_73lIfJtH' }}
    steps:
      - name: Consultar o banco
        run: |
          resposta=$(curl --silent --show-error --fail --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase respondeu: $resposta"
